<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 nimmt! Online</title><style>body{font-family:Arial;margin:0;background:#f4f4f4;color:#202020}.app{max-width:1100px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rowbox{border:2px solid #ddd;border-radius:12px;padding:9px;background:#fafafa}.clickable{cursor:pointer}.clickable:hover{border-color:#555}.collecting{border-color:#d71920;background:#fff0f0}.card{display:inline-flex;width:55px;height:76px;margin:3px;border:1px solid #aaa;border-radius:9px;background:#fff;flex-direction:column;align-items:center;justify-content:center}.handcard{cursor:pointer}.handcard:hover{transform:translateY(-3px)}.selected{outline:3px solid #222;transform:translateY(-6px)}.sixth{border:3px solid #d71920;background:#ffe4e4;color:#a00}.hand{display:flex;overflow:auto}.badge{border:1px solid #ddd;border-radius:999px;padding:7px 11px}.revealBadge{display:inline-flex;align-items:center;gap:5px;margin:3px;padding:4px 8px;font-size:12px;line-height:1.1}.revealName{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.revealCard{font-size:15px}.msg{padding:12px;border-left:5px solid #444}.warn{background:#fff0f0;border-left-color:#d71920}.good{background:#effaf4;border-left-color:#177245}button{border:0;border-radius:9px;padding:10px 15px;background:#222;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.layout{display:grid;grid-template-columns:1fr 280px;gap:12px}.chat{height:180px;overflow:auto;border:1px solid #ddd;padding:8px}.players div{padding:7px;border-bottom:1px solid #eee}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.rows{grid-template-columns:1fr}}</style></head><body><div class="app"><div id="lobby" class="panel"><h1>🐮 6 nimmt! Online</h1><p>2–10 người · chơi với bạn bằng mã phòng</p><input id="name" placeholder="Tên của bạn" maxlength="18"><input id="code" placeholder="Mã phòng" maxlength="6"><button id="create">Tạo phòng</button><button id="join">Vào phòng</button><div id="lobbyMsg"></div><div id="lobbyPlayers"></div><button id="start" class="hidden">Bắt đầu</button></div><div id="game" class="hidden"><div class="top"><h1>🐮 6 nimmt!</h1><div><span class="badge">Lượt <b id="turn">1</b>/10</span> <span class="badge">Phòng: <b id="roomCode"></b></span></div></div><div id="message" class="panel msg"></div><div class="layout"><main><div class="panel"><b>🎴 Bàn chơi</b><div id="rows" class="rows" style="margin-top:9px"></div><div id="collect" class="panel warn hidden"></div></div><div class="panel"><b>🔓 Tất cả lá đã tiết lộ</b><div id="reveal"></div></div><div class="panel"><div class="top"><b>🃏 Bài của bạn</b><button id="play" disabled>Chọn lá</button></div><div id="hand" class="hand"></div></div></main><aside><div class="panel"><b>🏆 Điểm mọi người</b><div id="scores" class="players"></div></div><div class="panel"><b>💬 Chat</b><div id="chat" class="chat"></div><input id="chatInput" placeholder="Nhắn tin..."><button id="chatBtn">Gửi</button></div></aside></div></div></div><script>(()=>{let ws=null,me=null,state=null,selected=null;const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function connect(msg){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify(msg));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='hello'){me=m.id;return}if(m.type==='state'){state=m.state;render()}if(m.type==='chat'){let d=document.createElement('div');d.textContent=m.name+': '+m.text;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}if(m.type==='error')$("lobbyMsg").textContent='❌ '+m.message;if(m.type==='kicked'){alert(m.message);location.reload()}}};function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}$('create').onclick=()=>{let n=$('name').value.trim();if(!n)return $('lobbyMsg').textContent='Nhập tên trước.';connect({type:'create',name:n})};$('join').onclick=()=>{let n=$('name').value.trim(),c=$('code').value.trim();if(!n||!c)return $('lobbyMsg').textContent='Nhập tên và mã phòng.';connect({type:'join',name:n,code:c})};$('start').onclick=()=>send({type:'start'});$('play').onclick=()=>{if(selected!=null)send({type:'play',card:selected})};$('chatBtn').onclick=chatSend;$('chatInput').onkeydown=e=>{if(e.key==='Enter')chatSend()};function chatSend(){let t=$('chatInput').value.trim();if(t){send({type:'chat',text:t});$('chatInput').value=''}}function bulls(n){if(n===55)return 7;if(n%11===0)return 5;if(n%10===5)return 2;if(n%10===0)return 3;return 1}function icons(n){return '🐮'.repeat(Math.min(5,bulls(n)))}function card(n,cls=''){return `<div class="card ${cls}"><div>${icons(n)}</div><b style="font-size:21px">${n}</b></div>`}function render(){if(!state)return;$('lobby').classList.toggle('hidden',state.phase!=='lobby');$('game').classList.toggle('hidden',state.phase==='lobby');$('roomCode').textContent=state.code;$('turn').textContent=state.turn;$('message').className='panel msg '+(state.alert?'warn':'');$('message').textContent=state.message;$('start').classList.toggle('hidden',!(state.phase==='lobby'&&state.host===me));$('lobbyPlayers').innerHTML='<h3>Người chơi</h3>'+state.players.map(p=>`<div>${esc(p.name)}${p.id===state.host?' 👑':''} ${p.id===me?'(Bạn)':''} ${state.host===me&&p.id!==me?`<button onclick="kick('${p.id}')">Kick</button>`:''}</div>`).join('');$('scores').innerHTML=state.players.map(p=>`<div>${esc(p.name)} ${p.id===state.host?'👑':''}<span style="float:right"><b>${p.score}</b> 🐮</span></div>`).join('');$('reveal').innerHTML=(state.revealed||[]).map(x=>`<span class="badge revealBadge" style="${x.active?'outline:3px solid #222':''}"><span class="revealName" title="${esc(x.name)}">${esc(x.name)}</span><b class="revealCard">${x.card}</b></span>`).join('');renderRows();let mep=state.players.find(p=>p.id===me);$('hand').innerHTML=(mep?.hand||[]).map(n=>card(n,n===selected?'selected':'handcard')).join('');document.querySelectorAll('#hand .handcard').forEach((el,i)=>el.onclick=()=>{selected=mep.hand[i];render()});$('play').disabled=!(state.phase==='playing'&&selected!=null&&!(mep?.submitted));if(state.phase!=='playing')selected=null}function renderRows(){let p=state.pending;$('rows').innerHTML=state.rows.map((r,i)=>{let hi=p&&p.row===i,can=p&&p.player===me&&((p.type==='place'||p.type==='sixth')&&hi||p.type==='forced');return `<div class="rowbox ${hi?'collecting':''} ${can?'clickable':''}" data-row="${i}"><div>Hàng ${i+1} · Lá cuối: <b>${r[r.length-1]}</b>${r.length===5&&!hi?' · ⚠️ đủ 5 lá':''}${hi&&p.type==='sixth'?' · 🚨 LÁ THỨ 6':''}</div><div>${r.map(n=>card(n)).join('')}${hi&&p.card!=null&&p.type==='sixth'?card(p.card,'sixth'):''}</div>${can?`<small style="color:#b00000">${p.type==='sixth'?'Bấm hàng này để THU BÀI.':p.type==='forced'?'Bấm hàng này để THU BÀI.':'Bấm hàng này để ghép.'}</small>`:''}</div>`}).join('');document.querySelectorAll('#rows .clickable').forEach(el=>el.onclick=()=>send({type:'rowClick',row:Number(el.dataset.row)}));if(p&&p.player===me){$('collect').classList.remove('hidden');$('collect').innerHTML=`<b>${p.type==='sixth'?'🚨 LÁ THỨ 6 — THU BÀI':'🐮 THU BÀI'}</b><div style="margin-top:6px">${esc(p.text||'')}</div>`}else $('collect').classList.add('hidden')}window.kick=id=>send({type:'kick',playerId:id});})();</script></body></html>
