<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6 nimmt! Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131a;color:#f5f6f8;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.center{min-height:100vh;display:grid;place-items:center}.panel{background:#191e28;border:1px solid #303747;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0007}.home{width:min(560px,94vw);text-align:center}.home h1{font-size:48px;margin:0 0 8px}.muted{color:#aeb7c8}.inputs,.actions,.players,.hand,.rowBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.inputs{margin:18px 0}.input{background:#0d1016;border:1px solid #3a4252;color:#fff;border-radius:10px;padding:12px 14px;min-width:210px}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer;background:#f4c542;color:#111}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#303848;color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.code{font-size:23px;font-weight:900;letter-spacing:4px}.players{justify-content:flex-start;margin:14px 0}.player{background:#262c38;padding:7px 11px;border-radius:9px}.me{outline:2px solid #f4c542}.msg{padding:12px;border-radius:10px;background:#252b38;margin:12px 0}.danger{background:#68282e}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.pile{background:#202633;border-radius:14px;padding:12px;min-height:155px}.pile h3{font-size:13px;color:#aab3c3;margin:0 0 8px}.cards{display:flex;align-items:center;justify-content:center;min-height:110px;overflow-x:auto}.mini{width:55px;height:78px;margin:-6px;border-radius:9px;background:#f7f7f2;color:#17191d;border:2px solid #d4d5cf;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex:none}.hand{justify-content:flex-start}.bigcard{width:72px;height:104px;border-radius:12px;background:#fafaf5;color:#17191d;border:3px solid #d5d6d0;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #0005;transition:.15s}.bigcard:hover{transform:translateY(-6px)}.bigcard.selected{outline:4px solid #f4c542;transform:translateY(-8px)}.scoreGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.score{background:#232936;padding:10px;border-radius:9px;display:flex;justify-content:space-between}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modalBox{width:min(560px,94vw);background:#191e28;border:1px solid #3a4252;border-radius:18px;padding:24px;text-align:center}.rowBtns .btn{background:#303848;color:#fff}@media(max-width:760px){.board{grid-template-columns:repeat(2,1fr)}.bigcard{width:58px;height:86px;font-size:23px}.home h1{font-size:40px}}
</style>
</head>
<body><div id="app"></div>
<script>
let ws=null,me=null,state=null,selected=null,modalOpen=false;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){app.innerHTML='<div class="center"><div class="panel home"><h1>🐮 6 nimmt!</h1><p class="muted">Chơi online realtime · 2–10 người</p><div class="inputs"><input id="name" class="input" maxlength="18" placeholder="Tên của bạn"><input id="room" class="input" maxlength="8" placeholder="Mã phòng (nếu vào phòng)"></div><div class="actions"><button class="btn" onclick="connect(false)">TẠO PHÒNG</button><button class="btn alt" onclick="connect(true)">VÀO PHÒNG</button></div><p class="muted">Mỗi người 10 lá · 4 hàng · xử lý lá từ nhỏ đến lớn.</p></div></div>'}
function connect(join){const name=document.getElementById('name').value.trim()||'Người chơi';const code=document.getElementById('room').value.trim().toUpperCase();if(join&&!code)return alert('Nhập mã phòng trước.');const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:join?'join':'create',name,code}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hello'){me=m.id;return}if(m.type==='error'){alert(m.message);return}if(m.type==='state'){state=m.state;selected=null;render()}};ws.onclose=()=>{if(state)alert('Mất kết nối với phòng.');state=null;me=null;home()};ws.onerror=()=>alert('Không kết nối được máy chủ.');}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function render(){if(!state)return;if(state.phase==='lobby'){renderLobby();return}const p=state.players.find(x=>x.id===me);if(!p){home();return}let html='<div class="wrap"><div class="panel"><div class="top"><div><h2>🐮 6 nimmt!</h2><span class="muted">Phòng '+esc(state.code)+' · '+esc(state.phase)+'</span></div><div><button class="btn" onclick="copyCode()">MỜI</button> <button class="btn alt" onclick="location.reload()">RỜI</button></div></div><div class="players">'+state.players.map(x=>'<span class="player '+(x.id===me?'me':'')+'">'+esc(x.name)+(x.host?' 👑':'')+' · '+x.score+' 🐮</span>').join('')+'</div><div class="msg '+(state.alert?'danger':'')+'">'+esc(state.message)+'</div><div class="board">'+state.rows.map((r,i)=>'<div class="pile"><h3>HÀNG '+(i+1)+' · '+r.length+' lá</h3><div class="cards">'+(r.length?r.map(n=>'<div class="mini">'+n+'</div>').join(''):'<span class="muted">Trống</span>')+'</div></div>').join('')+'</div>';
if(state.phase==='playing'){html+='<h3>🃏 Bài của '+esc(p.name)+' · '+p.hand.length+' lá</h3><div class="hand">'+p.hand.map((n,i)=>'<button class="bigcard '+(selected===n?'selected':'')+'" '+(p.submitted!==null?'disabled':'')+' onclick="play('+n+')">'+n+'</button>').join('')+'</div>'}
if(state.phase==='finished'&&state.host===me)html+='<div class="actions" style="margin-top:18px"><button class="btn" onclick="send({type:\'restart\'})">CHƠI VÁN MỚI</button></div>';
html+='<hr><h3>🏆 Điểm</h3><div class="scoreGrid">'+[...state.players].sort((a,b)=>a.score-b.score).map(x=>'<div class="score"><span>'+esc(x.name)+'</span><b>'+x.score+' 🐮</b></div>').join('')+'</div></div></div>';app.innerHTML=html;if(state.pending?.player===me&&!modalOpen)showCollect(state.pending)}
function renderLobby(){app.innerHTML='<div class="center"><div class="panel home"><h1>🐮 6 nimmt!</h1><h3>Mã phòng: <span class="code">'+esc(state.code)+'</span></h3><p class="muted">Gửi mã này cho bạn bè. Phòng tối đa 10 người.</p><div class="players">'+state.players.map(x=>'<span class="player '+(x.id===me?'me':'')+'">'+esc(x.name)+(x.host?' 👑':'')+'</span>').join('')+'</div>'+(state.host===me?'<button class="btn" onclick="send({type:\'start\'})" '+(state.players.length<2?'disabled':'')+'>BẮT ĐẦU</button>':'<p class="muted">Chờ chủ phòng bắt đầu…</p>')+'</div></div>'}
function play(card){if(state?.phase!=='playing')return;send({type:'play',card})}
function showCollect(p){modalOpen=true;const o=document.createElement('div');o.className='modal';let title=p.type==='sixth'?'🐮 LÁ THỨ 6!':'🐮 PHẢI THU HÀNG';let text=p.type==='sixth'?'Lá '+p.card+' là lá thứ 6 của Hàng '+(p.row+1)+'. Thu 5 lá đầu, lá này trở thành lá đầu hàng.':'Lá '+p.card+' nhỏ hơn lá cuối của cả 4 hàng. Chọn một hàng để thu.';o.innerHTML='<div class="modalBox"><h2>'+title+'</h2><p>'+text+'</p><button class="btn" onclick="collect('+p.row+')">THU BÀI</button></div>';document.body.appendChild(o)}
function collect(row){modalOpen=false;document.querySelector('.modal')?.remove();send({type:'collect',row})}
function copyCode(){navigator.clipboard?.writeText(state.code);alert('Mã phòng: '+state.code)}
home();
</script></body></html>
